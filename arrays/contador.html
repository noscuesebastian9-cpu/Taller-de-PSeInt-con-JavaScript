<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
</head>
<body>
    
    <h4>Botones de Aumento y Disminucion</h4>
    <input type="button" value="Aumentar" onclick="incrementar()">
    <!--El articulo "ONCLICK" llama a la función a la función "INCREMENTAR" Defina en el archivo JavaScript"-->

    <input type="button" value="Disminuir" onclick="decrementar()">
    <!--El articulo "ONCLICK" llama a la función a la función "DECREMENTAR" Defina en el archivo JavaScript"-->
    
    <script src="contador.js"></script>
</body>
</html>
